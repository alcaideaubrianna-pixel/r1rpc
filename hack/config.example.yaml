gfcli:
  gen:
    dao:
      # 实际生成时通过 R1RPC_DAO_DSN 注入连接串，不在仓库保存凭据。
      - link: "mysql:USER:PASSWORD@tcp(127.0.0.1:3306)/r1rpc"
        tables: "files,storage_settings,image_*,xhs_user_profiles"
        path: "internal"
        group: "default"
        jsonCase: "CamelLower"
        descriptionTag: true
        overwriteDao: false
        stdTime: true
