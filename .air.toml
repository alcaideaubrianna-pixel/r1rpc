root = "."
tmp_dir = ".tmp/air"

[build]
cmd = "go build -o ./.tmp/air/r1rpc-server ./cmd/server"
bin = ".tmp/air/r1rpc-server"
include_ext = ["go", "yaml", "yml", "html", "css", "js"]
exclude_dir = [".git", ".tmp", "deploy", "docs", "web/node_modules"]
exclude_regex = ["_test.go"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = "2s"

[log]
time = true

[screen]
clear_on_rebuild = false
keep_scroll = true
