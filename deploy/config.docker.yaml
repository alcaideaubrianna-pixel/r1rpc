# 本地 docker 部署用配置（被 docker-compose 挂载为 /app/config.yaml）。
# 仅用于本地，生产请改 jwt_secret / admin.password / mysql.password。
server:
  http_addr: ":9876"
  jwt_secret: "r1rpc-local-docker-secret-change-me"
  time_zone: "Asia/Shanghai"

admin:
  username: "admin"
  password: "123456"

mysql:
  host: "mysql"        # docker-compose 内的服务名
  port: 3306
  user: "root"
  password: "r1rpc_dev"
  db: "r1rpc"

storage:
  backend: "file"
  local_path: "/app/data/uploads"

# Redis 由 docker-compose 启动，供本地联调检查；当前 r1rpc 队列仍使用已有内存实现，
# 因此这里不配置未使用的 Redis 队列后端。

limits:
  client_max_in_flight: 1
  action_default_max_in_flight: 1
  queue_lease_duration_seconds: 10
  queue_lease_reaper_interval_seconds: 1
  execution_grace_seconds: 30
  client_queue_idle_ttl_seconds: 600
  request_timeout_seconds: 25
  device_offline_seconds: 20
