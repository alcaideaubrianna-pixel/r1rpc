services:
  mysql:
    image: ${R1RPC_MYSQL_IMAGE:-mysql:8.4}
    container_name: r1rpc-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-r1rpc_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-r1rpc}
    ports:
      - "${R1RPC_MYSQL_PORT:-3306}:3306"
    volumes:
      - r1rpc-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  redis:
    image: ${R1RPC_REDIS_IMAGE:-redis:7-alpine}
    container_name: r1rpc-redis
    ports:
      - "${R1RPC_REDIS_PORT:-6379}:6379"
    volumes:
      - r1rpc-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: r1rpc-server
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
      - r1rpc-uploads:/app/data/uploads
    environment:
      APP_NAME: ${APP_NAME:-r1rpc}
      SERVER_ID: ${SERVER_ID:-r1rpc-local-1}
      HTTP_ADDR: ":9876"
      JWT_SECRET: ${JWT_SECRET:-r1rpc-local-docker-secret-change-me}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-123456}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-r1rpc_dev}
      MYSQL_DB: ${MYSQL_DATABASE:-r1rpc}
    ports:
      - "${R1RPC_HTTP_PORT:-9876}:9876"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9876/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  r1rpc-mysql-data:
  r1rpc-redis-data:
  r1rpc-uploads:
