services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 Dokploy 配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-r1rpc}
      MYSQL_USER: ${MYSQL_USER:-r1rpc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 Dokploy 配置 MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [r1rpc]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请在 Dokploy 配置 REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 Dokploy 配置 REDIS_PASSWORD}
    networks: [r1rpc]

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-r1rpc}
      SERVER_ID: ${SERVER_ID:-r1rpc-dokploy-1}
      HTTP_ADDR: ":9876"
      TIME_ZONE: ${TZ:-Asia/Shanghai}
      LOG_DIR: ${LOG_DIR:-/app/data/logs}
      LOG_MAX_DIR_MB: ${LOG_MAX_DIR_MB:-200}
      JWT_SECRET: ${JWT_SECRET:?请在 Dokploy 配置 JWT_SECRET}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?请在 Dokploy 配置 BOOTSTRAP_ADMIN_PASSWORD}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-r1rpc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 Dokploy 配置 MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DATABASE:-r1rpc}
      MYSQL_MAX_OPEN_CONNS: ${MYSQL_MAX_OPEN_CONNS:-64}
      MYSQL_MAX_IDLE_CONNS: ${MYSQL_MAX_IDLE_CONNS:-16}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 Dokploy 配置 REDIS_PASSWORD}
      REDIS_DB: "0"
      REDIS_API_WORKER_CONCURRENCY: ${REDIS_API_WORKER_CONCURRENCY:-4}
      REDIS_DOWNLOAD_WORKER_CONCURRENCY: ${REDIS_DOWNLOAD_WORKER_CONCURRENCY:-12}
      QUEUE_SCAN_INTERVAL_SECONDS: ${QUEUE_SCAN_INTERVAL_SECONDS:-5}
      DOWNLOAD_SCAN_INTERVAL_SECONDS: ${DOWNLOAD_SCAN_INTERVAL_SECONDS:-2}
      STORAGE_BACKEND: file
      STORAGE_LOCAL_PATH: /app/data/uploads
      OCR_TESSERACT_BIN: tesseract
      OCR_LANGUAGES: ${OCR_LANGUAGES:-chi_sim+eng}
    volumes:
      - uploads_data:/app/data/uploads
      - logs_data:/app/data/logs
    expose:
      - "9876"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9876/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [r1rpc]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  logs_data:

networks:
  r1rpc:
    driver: bridge
